<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Touch Picker</title>
  <link rel="stylesheet" href="style.css?v=room-debug-4">
  <script src="script.js?v=room-debug-4" defer></script>
</head>
<body>
  <section id="setup" class="setup">
    <div class="panel">
      <button id="createRoom" type="button">Create room</button>
      <div class="join-row">
        <input id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code">
        <button id="joinRoom" type="button">Join</button>
      </div>
      <p id="error" role="status"></p>
    </div>
  </section>

  <section id="lobby" class="setup" hidden>
    <div class="panel lobby-panel">
      <p class="lobby-label">ROOM CODE</p>
      <strong id="roomCode"></strong>
      <button id="copyCode" type="button">Copy code</button>
      <button id="enterGame" type="button">Enter game</button>
      <p id="lobbyError" role="status"></p>
    </div>
  </section>

  <main id="game" hidden>
    <div id="playArea"><div id="touchLayer" aria-hidden="true"></div></div>
  </main>
</body>
</html>
