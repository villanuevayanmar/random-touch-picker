<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Random Touch Picker</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=1">
  <link rel="stylesheet" href="style.css?v=room-debug-6">
  <script src="script.js?v=room-debug-6" defer></script>
</head>
<body>
  <section id="setup" class="setup">
    <div class="panel">
      <header class="brand">
        <img src="logo.svg?v=1" alt="" width="56" height="56">
        <div class="brand-name"><strong>RANDOM TOUCH</strong><span>PICKER</span></div>
      </header>
      <button id="createRoom" type="button">Create room</button>
      <div class="join-row">
        <input id="roomInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ROOM CODE" aria-label="Room code">
        <button id="joinRoom" type="button">Join</button>
      </div>
      <p id="error" role="status"></p>
    </div>
  </section>

  <section id="lobby" class="setup" hidden>
    <div class="panel lobby-panel">
      <header class="brand">
        <img src="logo.svg?v=1" alt="" width="56" height="56">
        <div class="brand-name"><strong>RANDOM TOUCH</strong><span>PICKER</span></div>
      </header>
      <p class="lobby-label">ROOM CODE</p>
      <strong id="roomCode"></strong>
      <button id="copyCode" type="button">Copy code</button>
      <button id="enterGame" type="button">Enter game</button>
      <p id="lobbyError" role="status"></p>
    </div>
  </section>

  <main id="game" hidden>
    <div id="playArea"><div id="touchLayer" aria-hidden="true"></div></div>

    <div id="roundResult" class="result-overlay" hidden>
      <section class="result-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <p class="result-eyebrow">ROUND RESULT</p>
        <h1 id="resultTitle"></h1>
        <p id="resultMessage" class="result-message"></p>
        <div class="winning-color">
          <span id="winnerSwatch" aria-hidden="true"></span>
          <strong id="winnerColorLabel"></strong>
        </div>
        <div class="ready-section">
          <div class="ready-heading">
            <strong>Players</strong>
            <span id="readySummary">Waiting for devices…</span>
          </div>
          <div id="deviceList" class="device-list"></div>
        </div>
        <button id="readyButton" type="button">I'M READY</button>
        <p class="ready-hint">The next round starts when everyone is ready.</p>
      </section>
    </div>
  </main>
</body>
</html>
